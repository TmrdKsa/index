<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bārq Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom right, #111827, #1e3a8a, #6d28d9);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      background-color: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }
    .header, .footer {
      background-color: rgba(17, 24, 39, 0.8);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
    }
    .footer {
      border-top: 1px solid rgba(59, 130, 246, 0.3);
      border-bottom: none;
      font-size: 13px;
      color: #9ca3af;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .panel {
      padding: 30px;
    }
    .panel h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
    }
    .icons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .icon-box {
      background-color: rgba(55, 65, 81, 0.5);
      padding: 15px;
      border-radius: 12px;
      transition: background 0.3s;
      cursor: pointer;
    }
    .icon-box:hover {
      background-color: rgba(75, 85, 99, 0.5);
    }
    .menu-section {
      background-color: rgba(17, 24, 39, 0.5);
      border: 1px solid rgba(75, 85, 99, 0.4);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .menu-header {
      padding: 15px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s;
    }
    .menu-header:hover {
      background-color: rgba(55, 65, 81, 0.5);
    }
    .menu-items {
      display: none;
      border-top: 1px solid rgba(75, 85, 99, 0.4);
    }
    .menu-item {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid rgba(75, 85, 99, 0.3);
    }
    .menu-item:last-child {
      border-bottom: none;
    }
    .menu-item-icon {
      background: linear-gradient(to bottom right, rgba(59,130,246,0.2), rgba(147,51,234,0.2));
      padding: 10px;
      border-radius: 8px;
    }
    .menu-item-text h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .menu-item-text p {
      margin: 0;
      font-size: 13px;
      color: #9ca3af;
    }
    .rotate {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <span style="background:#2563eb;color:white;padding:4px 8px;border-radius:6px;font-size:12px;">edited</span>
        <i class="fas fa-shield-alt"></i>
        <span>Bārq Control</span>
        <span style="background:#7e22ce;color:white;padding:4px 8px;border-radius:6px;font-size:12px;">APP</span>
      </div>
    </div>
    <div class="panel">
      <h2>قائمة التحكم</h2>
      <div class="icons">
        <div class="icon-box"><i class="fas fa-tag" style="color:#60a5fa;font-size:24px;"></i></div>
        <div class="icon-box"><i class="fas fa-shield-alt" style="color:#a78bfa;font-size:24px;"></i></div>
        <div class="icon-box"><i class="fas fa-circle" style="color:#f472b6;font-size:24px;"></i></div>
        <div class="icon-box"><i class="fas fa-bolt" style="color:#facc15;font-size:24px;"></i></div>
        <div class="icon-box"><i class="fas fa-search" style="color:#4ade80;font-size:24px;"></i></div>
      </div>
      <p style="text-align:center;color:#d1d5db;">قم بالضغط على الزر المناسب</p>

      <div class="menu-section">
        <div class="menu-header" onclick="toggleMenu('basic')">
          <span>اضغط هنا للإدارة</span>
          <i id="arrow-basic" class="fas fa-chevron-down"></i>
        </div>
        <div id="menu-basic" class="menu-items">
          <div class="menu-item">
            <div class="menu-item-icon"><i class="fas fa-shield-alt"></i></div>
            <div class="menu-item-text"><h3>Server</h3><p>سيرفرات المراقب، سيرفرات المجتمع</p></div>
          </div>
          <div class="menu-item">
            <div class="menu-item-icon"><i class="fas fa-user"></i></div>
            <div class="menu-item-text"><h3>Avatar</h3><p>سيرفرات الإعلانات، سيرفرات الخيارات</p></div>
          </div>
          <div class="menu-item">
            <div class="menu-item-icon"><i class="fas fa-store"></i></div>
            <div class="menu-item-text"><h3>Store</h3><p>سيرفرات المتاجر، سيرفرات الخدمات</p></div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      لا تملك صلاحية لإرسال الرسائل في هذه القناة.
    </div>
  </div>

  <script>
    function toggleMenu(id) {
      const menu = document.getElementById('menu-' + id);
      const arrow = document.getElementById('arrow-' + id);
      const isOpen = menu.style.display === 'block';
      menu.style.display = isOpen ? 'none' : 'block';
      arrow.classList.toggle('rotate', !isOpen);
    }
  </script>
</body>
</html>
